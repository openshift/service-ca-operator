apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:operator:service-ca-operator
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
rules:
# --- SCC: allow the operator pod to use the nonroot-v2 SCC ---

- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - nonroot-v2
  verbs:
  - use

# --- Operand lifecycle: resources the operator directly manages ---

# Create/update the openshift-service-ca namespace
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
  - update

# Manage the controller ServiceAccount and signing CA Secret and CA bundle
# ConfigMap in the target namespace. Also read secrets/configmaps from
# openshift-config, openshift-config-managed, and the operator namespace
# for the resourceSyncController.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete

# Resolve pod owner chain for event recording (library-go controllercmd)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list

# Manage the controller Deployment and resolve owner chain for event recording
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete

# Emit events
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update

# --- RBAC: manage the controller's ClusterRole/ClusterRoleBinding ---
# The bind and escalate verbs allow the operator to grant the controller
# permissions the operator itself holds without requiring cluster-admin.

- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - bind
  - escalate

- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update

# Manage the controller's namespace-scoped Role/RoleBinding
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - bind
  - escalate

  # Manage the controller's namespace-scoped Role/RoleBinding
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update

# --- ClusterOperator status reporting ---

- apiGroups:
  - config.openshift.io
  resources:
  - clusteroperators
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

- apiGroups:
  - config.openshift.io
  resources:
  - clusteroperators/status
  verbs:
  - update
  - patch

# --- Feature gate and cluster config observation ---

- apiGroups:
  - config.openshift.io
  resources:
  - clusterversions
  - featuregates
  - infrastructures
  - apiservers
  verbs:
  - get
  - list
  - watch

# --- ConfigurablePKI feature gate (when enabled) ---

- apiGroups:
  - config.openshift.io
  resources:
  - pkis
  verbs:
  - get
  - list
  - watch

# --- Permissions mirroring the controller's ClusterRole ---
# The operator must hold every permission it grants to the controller
# via the system:openshift:controller:service-ca ClusterRole (RBAC
# escalation prevention). These are the controller's cluster-wide
# permissions for signing certs and injecting CA bundles.

# Controller creates TLS Secrets in any namespace
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - update
  - patch

# Controller injects CA bundles into webhook configurations
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
  - update

# Controller injects CA bundles into CRDs
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - update

# Controller injects CA bundles into APIServices
- apiGroups:
  - apiregistration.k8s.io
  resources:
  - apiservices
  verbs:
  - get
  - list
  - watch
  - update
  - patch

# --- Operator custom resource ---

- apiGroups:
  - operator.openshift.io
  resources:
  - servicecas
  - servicecas/status
  verbs:
  - get
  - list
  - watch
  - update
  - patch

# --- Read and write leases for leader election ---

- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update

# --- Delegated authentication and authorization for metrics serving ---

- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create

- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:openshift:operator:service-ca-operator
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
roleRef:
  kind: ClusterRole
  name: system:openshift:operator:service-ca-operator
subjects:
- kind: ServiceAccount
  namespace: openshift-service-ca-operator
  name: service-ca-operator
